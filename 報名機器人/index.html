<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽球臨打報名</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d26;
    --surface2: #22263a;
    --accent: #c8f04a;
    --accent2: #4af0c8;
    --text: #f0f2f8;
    --muted: #8890aa;
    --danger: #f04a6a;
    --border: rgba(200,240,74,0.15);
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(200,240,74,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .container { width: 100%; max-width: 440px; position: relative; }

  /* Header */
  .header { text-align: center; padding: 44px 0 32px; }
  .badge {
    display: inline-block;
    border: 1px solid rgba(200,240,74,0.5);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 14vw, 76px);
    letter-spacing: 5px;
    line-height: 1;
  }
  h1 span { color: var(--accent); }
  .subtitle { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.9; }

  /* Info card */
  .info-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
  }
  .info-item label { display: block; font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
  .info-item span { font-size: 13px; font-weight: 500; }

  /* Slots */
  .slots-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .slots-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(200,240,74,0.05) 0%, transparent 60%);
  }
  .slots-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .slots-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    line-height: 1;
    color: var(--accent);
    letter-spacing: 4px;
  }
  .slots-number.full { color: var(--danger); }
  .slots-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 16px;
    gap: 4px;
  }
  .tab-btn {
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--surface2);
    color: var(--accent);
  }

  /* Form */
  .form-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .form-group input {
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: rgba(136,144,170,0.5); }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: var(--accent);
    color: #0f1117;
  }
  .btn-primary:hover { background: #d9ff5a; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: #3a3f50; color: var(--muted); cursor: not-allowed; transform: none; }

  .btn-cancel {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(240,74,106,0.4);
  }
  .btn-cancel:hover { background: rgba(240,74,106,0.1); }
  .btn-cancel:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Message */
  .message {
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 16px;
    display: none;
    line-height: 1.6;
  }
  .message.success { background: rgba(74,240,200,0.1); border: 1px solid rgba(74,240,200,0.3); color: var(--accent2); }
  .message.error { background: rgba(240,74,106,0.1); border: 1px solid rgba(240,74,106,0.3); color: var(--danger); }
  .message.show { display: block; }

  /* Full overlay */
  .full-banner {
    background: rgba(240,74,106,0.1);
    border: 1px solid rgba(240,74,106,0.3);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .full-banner.show { display: block; }
  .full-banner .icon { font-size: 32px; margin-bottom: 8px; }
  .full-banner p { color: var(--danger); font-weight: 700; font-size: 15px; }
  .full-banner small { color: var(--muted); font-size: 12px; }

  /* Footer */
  .footer { text-align: center; margin-top: 32px; color: var(--muted); font-size: 11px; line-height: 2; }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(15,17,23,0.3);
    border-top-color: #0f1117;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="badge">2026 Q4 · 10–12月</div>
    <h1>羽球<span>報名</span></h1>
    <p class="subtitle">
      新力羽球南科館 第7、8場地<br>
      費用 $200｜KOMBO No.1 一級天然鵝毛
    </p>
  </div>

  <!-- Info -->
  <div class="info-card">
    <div class="info-item">
      <label>時間</label>
      <span id="event-time">載入中...</span>
    </div>
    <div class="info-item">
      <label>地點</label>
      <span>南科館 7、8場</span>
    </div>
    <div class="info-item">
      <label>費用</label>
      <span>$200 / 人</span>
    </div>
    <div class="info-item">
      <label>用球</label>
      <span>KOMBO No.1</span>
    </div>
  </div>

  <!-- Slots -->
  <div class="slots-card">
    <div class="slots-label">臨打剩餘空位</div>
    <div class="slots-number" id="slots-num">—</div>
    <div class="slots-sub" id="slots-sub">讀取中...</div>
  </div>

  <!-- Full banner -->
  <div class="full-banner" id="full-banner">
    <div class="icon">🏸</div>
    <p>本週名額已額滿</p>
    <small>如需候補請聯繫管理員</small>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="form-tabs">
    <button class="tab-btn active" onclick="switchTab('signup')">我要報名</button>
    <button class="tab-btn" onclick="switchTab('cancel')">取消報名</button>
  </div>

  <!-- Message -->
  <div class="message" id="msg"></div>

  <!-- Signup Form -->
  <div class="form-card" id="form-signup">
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="signup-name" placeholder="請輸入姓名" maxlength="20">
    </div>
    <div class="form-group">
      <label>手機號碼（用於取消報名驗證）</label>
      <input type="tel" id="signup-phone" placeholder="09xxxxxxxx" maxlength="10">
    </div>
    <button class="btn btn-primary" id="signup-btn" onclick="doSignup()">確認報名</button>
  </div>

  <!-- Cancel Form -->
  <div class="form-card hidden" id="form-cancel">
    <div class="form-group">
      <label>姓名（與報名時相同）</label>
      <input type="text" id="cancel-name" placeholder="請輸入姓名" maxlength="20">
    </div>
    <div class="form-group">
      <label>手機號碼（驗證用）</label>
      <input type="tel" id="cancel-phone" placeholder="09xxxxxxxx" maxlength="10">
    </div>
    <button class="btn btn-cancel" id="cancel-btn" onclick="doCancel()">確認取消報名</button>
  </div>

  <div class="footer">
    名單即時同步 · 報名後 LINE 群組將自動更新<br>
    如有問題請聯繫管理員
  </div>
</div>

<script>
  // ======================================================
  // ⚙️  設定區：填入你的 Firebase 專案資訊
  // ======================================================
  const API_URL = 'https://badminton-signup-vercel.vercel.app';
  // ======================================================

  let currentSlots = 0;
  let isFull = false;
  let currentTab = 'signup';

  async function fetchStatus() {
    try {
      const res = await fetch(`${API_URL}/api/status`);
      const data = await res.json();
      if (!data) return;

      // 更新時間
      if (data.eventTime) {
        document.getElementById('event-time').textContent = data.eventTime;
      }

      // 使用 API 回傳的數值
      const maxSlots = data.maxSlots || 7;
      const taken = data.taken || 0;
      currentSlots = data.remaining || 0;
      isFull = currentSlots <= 0;

      // 更新 UI
      const numEl = document.getElementById('slots-num');
      const subEl = document.getElementById('slots-sub');
      numEl.textContent = isFull ? '0' : currentSlots;
      numEl.className = 'slots-number' + (isFull ? ' full' : '');
      subEl.textContent = isFull ? '名額已滿' : `共 ${maxSlots} 個臨打名額，已報名 ${taken} 人`;

      // 額滿時隱藏報名表單
      document.getElementById('full-banner').className = 'full-banner' + (isFull ? ' show' : '');
      document.getElementById('form-tabs').style.display = isFull ? 'none' : '';
      document.getElementById('form-signup').style.display = isFull ? 'none' : '';
      if (isFull && currentTab === 'signup') switchTab('cancel');

    } catch (e) {
      console.error('無法讀取資料', e);
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'signup') || (i === 1 && tab === 'cancel'));
    });
    document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    document.getElementById('form-cancel').classList.toggle('hidden', tab !== 'cancel');
    clearMsg();
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = `message show ${type}`;
  }
  function clearMsg() {
    document.getElementById('msg').className = 'message';
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? `<span class="spinner"></span>處理中...` : label;
  }

  async function doSignup() {
    const name = document.getElementById('signup-name').value.trim();
    const phone = document.getElementById('signup-phone').value.trim();
    if (!name) { showMsg('請輸入姓名', 'error'); return; }
    if (!/^09\d{8}$/.test(phone)) { showMsg('請輸入正確的手機號碼（09xxxxxxxx）', 'error'); return; }
    if (isFull) { showMsg('名額已滿，無法報名', 'error'); return; }

    setLoading('signup-btn', true, '確認報名');
    try {
      const res = await fetch(`${API_URL}/api/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        showMsg(`✅ ${name} 報名成功！LINE 群組名單已更新。`, 'success');
        document.getElementById('signup-name').value = '';
        document.getElementById('signup-phone').value = '';
        fetchStatus();
      } else {
        showMsg(data.message || '報名失敗，請稍後再試', 'error');
      }
    } catch (e) {
      showMsg('網路錯誤，請稍後再試', 'error');
    }
    setLoading('signup-btn', false, '確認報名');
  }

  async function doCancel() {
    const name = document.getElementById('cancel-name').value.trim();
    const phone = document.getElementById('cancel-phone').value.trim();
    if (!name) { showMsg('請輸入姓名', 'error'); return; }
    if (!/^09\d{8}$/.test(phone)) { showMsg('請輸入正確的手機號碼', 'error'); return; }

    setLoading('cancel-btn', true, '確認取消報名');
    try {
      const res = await fetch(`${API_URL}/api/cancel`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        showMsg(`✅ ${name} 的報名已取消。`, 'success');
        document.getElementById('cancel-name').value = '';
        document.getElementById('cancel-phone').value = '';
        fetchStatus();
      } else {
        showMsg(data.message || '取消失敗，姓名或電話不符', 'error');
      }
    } catch (e) {
      showMsg('網路錯誤，請稍後再試', 'error');
    }
    setLoading('cancel-btn', false, '確認取消報名');
  }

  // 初始化 & 每 30 秒自動刷新
  fetchStatus();
  setInterval(fetchStatus, 30000);
</script>
</body>
</html>
